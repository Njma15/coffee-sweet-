<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>قهوة وحلا</title>
<style>
    body {
        background: linear-gradient(135deg, #ffe98a, #ffb3d9);
        font-family: "Tajawal", sans-serif;
        text-align: center;
        padding: 40px;
        color: #5a3a2e;
    }

    .card {
        background: #fff;
        padding: 25px;
        border-radius: 20px;
        width: 330px;
        margin: auto;
        box-shadow: 0 0 20px rgba(0,0,0,0.1);
    }

    img {
        width: 180px;
        margin-bottom: 20px;
    }

    h1 {
        font-size: 26px;
        margin-bottom: 10px;
    }

    p {
        font-size: 18px;
        margin: 8px 0;
    }

    .btn {
        display: inline-block;
        background: #ffb3d9;
        padding: 12px 20px;
        border-radius: 12px;
        margin-top: 15px;
        font-size: 18px;
        color: #5a3a2e;
        text-decoration: none;
    }
</style>
</head>

<body>

<div class="card">
    <img src="https://i.imgur.com/8mQeQyT.png" alt="coffee">
    <h1>قهوة وحلا</h1>
    <p>موعدنا اليوم السبت</p>
    <p>الساعة ٦ مساءً</p>
    <p>أجواء لطيفة وألوان فريحة</p>

    <a class="btn" href="#">جاهز؟</a>
</div>

</body>
</html>
